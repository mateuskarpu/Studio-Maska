<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Maska</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0a0a;
    --fg: #f2f0ea;
    --muted: #8c8a82;
    --line: #2a2a27;
    --cell: #161614;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html,body{
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', sans-serif;
    width: 100%;
    overflow-x: hidden;
  }
  a{ color: inherit; text-decoration: none; }

  /* ---------- HEADER ---------- */
  header{
    display:flex;
    justify-content: flex-end;
    align-items: center;
    padding: 28px 40px 0;
  }
  .logo-slot{
    width: 120px;
    height: 48px;
    border: 1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--muted);
  }

  /* ---------- NAV ---------- */
  nav{
    display:flex;
    justify-content:center;
    gap: clamp(16px, 3vw, 44px);
    flex-wrap: wrap;
    padding: 36px 24px 0;
    border-bottom: 1px solid var(--line);
    padding-bottom: 20px;
    margin: 0 40px;
  }
  nav a{
    font-size: 14px;
    color: var(--fg);
    position: relative;
    padding-bottom: 4px;
    transition: color 0.25s ease;
  }
  nav a::after{
    content:"";
    position:absolute;
    left:0; bottom:0;
    width:0%;
    height:1px;
    background: var(--fg);
    transition: width 0.25s ease;
  }
  nav a:hover{ color: var(--fg); }
  nav a:hover::after{ width:100%; }

  /* ---------- HERO ---------- */
  .hero{
    text-align:center;
    padding: 90px 24px 100px;
  }
  .hero h1{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: clamp(42px, 8vw, 84px);
    letter-spacing: 0.01em;
    line-height: 1;
  }
  .hero p{
    margin-top: 22px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(16px, 2vw, 20px);
    color: var(--muted);
  }

  /* ---------- GRID ---------- */
  .grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    background: var(--line);
    border-top: 1px solid var(--line);
  }
  .cell{
    position:relative;
    aspect-ratio: 4 / 5;
    background: var(--cell);
    overflow:hidden;
    display:block;
  }
  .cell .placeholder-img{
    position:absolute;
    inset:0;
    background:
      linear-gradient(135deg, #1d1d1a 0%, #121210 100%);
  }
  .cell .overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(10,10,10,0);
    transition: background 0.35s ease;
  }
  .cell .overlay span{
    font-family:'Cormorant Garamond', serif;
    font-size: 20px;
    letter-spacing: 0.02em;
    color: var(--fg);
    opacity:0;
    transform: translateY(8px);
    transition: opacity 0.35s ease, transform 0.35s ease;
    text-align:center;
    padding: 0 12px;
  }
  .cell:hover .overlay{ background: rgba(10,10,10,0.72); }
  .cell:hover .overlay span{ opacity:1; transform: translateY(0); }
  .cell:focus-visible{ outline: 1px solid var(--fg); outline-offset: -4px; }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 720px){
    header{ padding: 20px 20px 0; justify-content:flex-end; }
    nav{ margin: 0 20px; gap: 14px 24px; padding-top: 24px; }
    nav a{ font-size: 13px; }
    .hero{ padding: 60px 20px 60px; }
    .grid{ grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 420px){
    .grid{ grid-template-columns: repeat(1, 1fr); }
  }
</style>
</head>
<body>

  <header>
    <div class="logo-slot">LOGO</div>
  </header>

  <nav>
    <a href="novidades.html">Novidades</a>
    <a href="residencial.html">Residencial</a>
    <a href="comercial.html">Comercial</a>
    <a href="edificios.html">Edifícios</a>
    <a href="interiores.html">Interiores</a>
    <a href="studio-maska.html">Studio Maska</a>
    <a href="contato.html">Contato</a>
  </nav>

  <section class="hero">
    <h1>Studio Maska</h1>
    <p>Espaços que narram a sua trajetória.</p>
  </section>

  <section class="grid">
    <!-- 3 colunas x 12 linhas = 36 projetos -->
  </section>

<script>
  const grid = document.querySelector('.grid');
  const total = 36; // 3 x 12
  for (let i = 1; i <= total; i++){
    const n = String(i).padStart(2, '0');
    const cell = document.createElement('a');
    cell.className = 'cell';
    cell.href = `projeto-${n}.html`;
    cell.innerHTML = `
      <div class="placeholder-img"></div>
      <div class="overlay"><span>Projeto ${n}</span></div>
    `;
    grid.appendChild(cell);
  }
</script>

</body>
</html>
